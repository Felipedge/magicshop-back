# MySQL para desarrollo en el puerto 3307 del PC.
# Uso:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: magicshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: magicshop
      MYSQL_USER: ${DB_USER:-magicshop}
      MYSQL_PASSWORD: ${DB_PASSWORD:-magicshop123}
      TZ: America/Santiago
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
